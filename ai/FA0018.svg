<text x="805" y="501" font-size="9.5" fill="#c4502e" font-weight="600" text-anchor="middle">However</text>
<line x1="805" y1="648" x2="805" y2="676" stroke="#666" stroke-width="1.2" marker-end="url(#ar)" opacity="0.9"/>
<line x1="805" y1="748" x2="805" y2="776" stroke="#3a6a8a" stroke-width="1.5" marker-end="url(#ar-cons)" opacity="0.9"/>
<text x="805" y="759" font-size="9.5" fill="#3a6a8a" font-weight="600" text-anchor="middle">This raises</text>
<line x1="805" y1="848" x2="805" y2="944" stroke="#3a6a8a" stroke-width="1.5" marker-end="url(#ar-cons)" opacity="0.9"/>
<text x="805" y="893" font-size="9.5" fill="#3a6a8a" font-weight="600" text-anchor="middle">In this paper</text>
<line x1="805" y1="1016" x2="805" y2="1044" stroke="#666" stroke-width="1.2" marker-end="url(#ar)" opacity="0.9"/>
<line x1="805" y1="1128" x2="805" y2="1156" stroke="#666" stroke-width="1.2" marker-end="url(#ar)" opacity="0.9"/>
<line x1="805" y1="1128" x2="427" y2="1336" stroke="#3a6a8a" stroke-width="1.5" marker-end="url(#ar-cons)" opacity="0.9"/>
<line x1="805" y1="1240" x2="805" y2="1336" stroke="#3a6a8a" stroke-width="1.5" marker-end="url(#ar-cons)" opacity="0.9"/>
<line x1="805" y1="1128" x2="1183" y2="1336" stroke="#666" stroke-width="1.2" marker-end="url(#ar)" opacity="0.9"/>
