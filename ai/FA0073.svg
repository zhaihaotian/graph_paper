<g>
<rect x="595" y="68" width="420" height="96" rx="6" fill="#e0ebf5" stroke="#6d8ba8" stroke-width="1.2"/>
<text x="805" y="82" text-anchor="middle" font-size="10.5" font-weight="700" fill="#333">N1 [Context]</text>
<text x="805" y="97" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">Streaming LLMs: KV cache grows linearly</text>
<text x="805" y="113" text-anchor="middle" font-size="9.5" fill="#555">Large language models (LLMs) deployed for streaming applications—chatbots,</text>
<text x="805" y="125" text-anchor="middle" font-size="9.5" fill="#555">real-time assistants, and continuous document processing—face a fundamental</text>
<text x="805" y="137" text-anchor="middle" font-size="9.5" fill="#555">memory constraint: the key-value (KV) cache grows linearly with sequence</text>
<text x="805" y="149" text-anchor="middle" font-size="9.5" fill="#555">length during…</text>
<title>N1 [Context] (cites=2)
Large language models (LLMs) deployed for streaming applications—chatbots, real-time assistants, and continuous document processing—face a fundamental memory constraint: the key-value (KV) cache grows linearly with sequence length during autoregressive generation (Vaswani et al., 2017; Kwon et al., 2023).</title>
</g>
<g>
<rect x="595" y="192" width="420" height="84" rx="6" fill="#e0ebf5" stroke="#6d8ba8" stroke-width="1.2"/>
<text x="805" y="206" text-anchor="middle" font-size="10.5" font-weight="700" fill="#333">N2 [Context]</text>
<text x="805" y="221" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">Bounded caches: rolling window</text>
<text x="805" y="237" text-anchor="middle" font-size="9.5" fill="#555">For sequences extending to tens of thousands of tokens, unbounded caching</text>
<text x="805" y="249" text-anchor="middle" font-size="9.5" fill="#555">becomes infeasible, motivating the use of bounded-memory strategies such as</text>
<text x="805" y="261" text-anchor="middle" font-size="9.5" fill="#555">rolling-window attention that retains only the most recent W tokens.</text>
<title>N2 [Context] (cites=0)
For sequences extending to tens of thousands of tokens, unbounded caching becomes infeasible, motivating the use of bounded-memory strategies such as rolling-window attention that retains only the most recent W tokens.</title>
</g>
<g>
<rect x="595" y="304" width="420" height="72" rx="6" fill="#e0ebf5" stroke="#6d8ba8" stroke-width="1.2"/>
<text x="805" y="318" text-anchor="middle" font-size="10.5" font-weight="700" fill="#333">N3 [Context]</text>
<text x="805" y="333" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">Naive rolling window degrades PPL</text>
<text x="805" y="349" text-anchor="middle" font-size="9.5" fill="#555">However, naive rolling-window caching causes catastrophic perplexity</text>
<text x="805" y="361" text-anchor="middle" font-size="9.5" fill="#555">degradation in pretrained transformers.</text>
<title>N3 [Context] (cites=0)
However, naive rolling-window caching causes catastrophic perplexity degradation in pretrained transformers.</title>
</g>
<circle cx="1022.0" cy="412.0" r="2.8" fill="#9b7a2e"/>
<circle cx="1022.0" cy="420.0" r="2.8" fill="#9b7a2e"/>
<g>
<rect x="595" y="404" width="420" height="84" rx="6" fill="#e0ebf5" stroke="#6d8ba8" stroke-width="1.2"/>
<text x="805" y="418" text-anchor="middle" font-size="10.5" font-weight="700" fill="#333">N4 [Context]</text>
<text x="805" y="433" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">Attention sinks at position 0</text>
<text x="805" y="449" text-anchor="middle" font-size="9.5" fill="#555">This failure is attributed to attention sinks—a phenomenon where certain</text>
<text x="805" y="461" text-anchor="middle" font-size="9.5" fill="#555">tokens, typically position 0, receive disproportionately high attention mass</text>
<text x="805" y="473" text-anchor="middle" font-size="9.5" fill="#555">regardless of semantic relevance (Xiao et al., 2023; Gu et al., 2024).</text>
<title>N4 [Context] (cites=2)
This failure is attributed to attention sinks—a phenomenon where certain tokens, typically position 0, receive disproportionately high attention mass regardless of semantic relevance (Xiao et al., 2023; Gu et al., 2024).</title>
</g>
<g>
<rect x="595" y="516" width="420" height="84" rx="6" fill="#e0ebf5" stroke="#6d8ba8" stroke-width="1.2"/>
<text x="805" y="530" text-anchor="middle" font-size="10.5" font-weight="700" fill="#333">N5 [Context]</text>
<text x="805" y="545" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">Sink eviction destabilizes generation</text>
<text x="805" y="561" text-anchor="middle" font-size="9.5" fill="#555">When these sink tokens are evicted from the rolling window, the softmax</text>
<text x="805" y="573" text-anchor="middle" font-size="9.5" fill="#555">normalization redistributes attention in unintended ways, destabilizing</text>
<text x="805" y="585" text-anchor="middle" font-size="9.5" fill="#555">generation.</text>
<title>N5 [Context] (cites=0)
When these sink tokens are evicted from the rolling window, the softmax normalization redistributes attention in unintended ways, destabilizing generation.</title>
</g>
<circle cx="803.0" cy="704.0" r="2.8" fill="#9b7a2e"/>
<g>
<rect x="436" y="696" width="360" height="96" rx="6" fill="#e8e8e8" stroke="#888" stroke-width="1.2"/>
<text x="616" y="710" text-anchor="middle" font-size="10.5" font-weight="700" fill="#333">N6 [Prior_Work]</text>
<text x="616" y="725" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">StreamingLLM: keep prefix sink tokens</text>
<text x="616" y="741" text-anchor="middle" font-size="9.5" fill="#555">StreamingLLM (Xiao et al., 2023) addresses this by preserving a</text>
<text x="616" y="753" text-anchor="middle" font-size="9.5" fill="#555">small number of prefix sink tokens alongside the rolling window,</text>
<title>N6 [Prior_Work] (cites=1)
StreamingLLM (Xiao et al., 2023) addresses this by preserving a small number of prefix sink tokens alongside the rolling window,</title>
</g>
<g>
<rect x="595" y="888" width="420" height="72" rx="6" fill="#f5dcd4" stroke="#c4502e" stroke-width="1.2"/>
<text x="805" y="902" text-anchor="middle" font-size="10.5" font-weight="700" fill="#333">N7 [Limitation]</text>
<text x="805" y="917" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">Prefix sinks: complex, waste capacity</text>
<text x="805" y="933" text-anchor="middle" font-size="9.5" fill="#555">but this solution adds engineering complexity and consumes cache capacity</text>
<text x="805" y="945" text-anchor="middle" font-size="9.5" fill="#555">that could otherwise store semantically relevant context.</text>
<title>N7 [Limitation] (cites=0)
but this solution adds engineering complexity and consumes cache capacity that could otherwise store semantically relevant context.</title>
</g>
<circle cx="1181.0" cy="704.0" r="2.8" fill="#9b7a2e"/>
<g>
<rect x="814" y="696" width="360" height="96" rx="6" fill="#e8e8e8" stroke="#888" stroke-width="1.2"/>
<text x="994" y="710" text-anchor="middle" font-size="10.5" font-weight="700" fill="#333">N8 [Prior_Work : ANCHOR]</text>
<text x="994" y="725" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">Gated attention eliminates sinks</text>
<text x="994" y="741" text-anchor="middle" font-size="9.5" fill="#555">Recent work on gated attention (Qiu et al., 2025) demonstrates</text>
<text x="994" y="753" text-anchor="middle" font-size="9.5" fill="#555">that post-SDPA gating—applying a learnable gate after scaled</text>
<text x="994" y="765" text-anchor="middle" font-size="9.5" fill="#555">dot-product attention—eliminates attention sinks by providing an</text>
<text x="994" y="777" text-anchor="middle" font-size="9.5" fill="#555">explicit &quot;do nothing&quot; mechanism for attention…</text>
<title>N8 [Prior_Work] (cites=1)
Recent work on gated attention (Qiu et al., 2025) demonstrates that post-SDPA gating—applying a learnable gate after scaled dot-product attention—eliminates attention sinks by providing an explicit &quot;do nothing&quot; mechanism for attention heads.</title>
</g>
<g>
<rect x="595" y="1056" width="420" height="72" rx="6" fill="#d5ece8" stroke="#3a8a7e" stroke-width="1.2"/>
<text x="805" y="1070" text-anchor="middle" font-size="10.5" font-weight="700" fill="#333">N9 [Method]</text>
<text x="805" y="1085" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">Question: prefix-free streaming?</text>
<text x="805" y="1101" text-anchor="middle" font-size="9.5" fill="#555">This raises a natural question: can sink-free attention enable prefix-free</text>
<text x="805" y="1113" text-anchor="middle" font-size="9.5" fill="#555">streaming?</text>
<title>N9 [Method] (cites=0)
This raises a natural question: can sink-free attention enable prefix-free streaming?</title>
</g>
<g>
<rect x="595" y="1156" width="420" height="72" rx="6" fill="#d5ece8" stroke="#3a8a7e" stroke-width="1.2"/>
<text x="805" y="1170" text-anchor="middle" font-size="10.5" font-weight="700" fill="#333">N10 [Method]</text>
<text x="805" y="1185" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">Hypothesis: no sinks → no prefix tokens</text>
<text x="805" y="1201" text-anchor="middle" font-size="9.5" fill="#555">If gated models do not develop attention sinks, they should not require</text>
<text x="805" y="1213" text-anchor="middle" font-size="9.5" fill="#555">prefix sink tokens to maintain stable streaming inference.</text>
<title>N10 [Method] (cites=0)
If gated models do not develop attention sinks, they should not require prefix sink tokens to maintain stable streaming inference.</title>
</g>
<g>
<rect x="595" y="1256" width="420" height="84" rx="6" fill="#d5ece8" stroke="#3a8a7e" stroke-width="1.2"/>
<text x="805" y="1270" text-anchor="middle" font-size="10.5" font-weight="700" fill="#333">N11 [Method]</text>
<text x="805" y="1285" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">Compare vanilla vs gated Qwen2-1B</text>
<text x="805" y="1301" text-anchor="middle" font-size="9.5" fill="#555">We investigate this hypothesis through systematic experiments comparing</text>
<text x="805" y="1313" text-anchor="middle" font-size="9.5" fill="#555">vanilla and gated Qwen2-1B models under pure rolling-window and prefix-sink</text>
<text x="805" y="1325" text-anchor="middle" font-size="9.5" fill="#555">cache regimes.</text>
<title>N11 [Method] (cites=0)
We investigate this hypothesis through systematic experiments comparing vanilla and gated Qwen2-1B models under pure rolling-window and prefix-sink cache regimes.</title>
</g>
<g>
<rect x="247" y="1436" width="360" height="96" rx="6" fill="#d8ead4" stroke="#3e8a3e" stroke-width="1.2"/>
<text x="427" y="1450" text-anchor="middle" font-size="10.5" font-weight="700" fill="#333">C1 [Contribution]</text>
<text x="427" y="1465" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">C1: prefix-free stability (1.015 vs 2.54)</text>
<text x="427" y="1481" text-anchor="middle" font-size="9.5" fill="#555">We demonstrate that gated attention achieves prefix-free streaming</text>
<text x="427" y="1493" text-anchor="middle" font-size="9.5" fill="#555">stability, with a PPL ratio of 1.015–1.007 between pure</text>
<text x="427" y="1505" text-anchor="middle" font-size="9.5" fill="#555">rolling-window and prefix-sink regimes, compared to 2.54 for</text>
<text x="427" y="1517" text-anchor="middle" font-size="9.5" fill="#555">vanilla attention.</text>
<title>C1 [Contribution] (cites=0)
We demonstrate that gated attention achieves prefix-free streaming stability, with a PPL ratio of 1.015–1.007 between pure rolling-window and prefix-sink regimes, compared to 2.54 for vanilla attention.</title>
</g>
<g>
<rect x="625" y="1436" width="360" height="96" rx="6" fill="#d8ead4" stroke="#3e8a3e" stroke-width="1.2"/>
<text x="805" y="1450" text-anchor="middle" font-size="10.5" font-weight="700" fill="#333">C2 [Contribution]</text>
<text x="805" y="1465" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">C2: causal mechanism, 99.3-100% sink reduction</text>
<text x="805" y="1481" text-anchor="middle" font-size="9.5" fill="#555">We verify the causal mechanism: gating reduces attention sink rate</text>
<text x="805" y="1493" text-anchor="middle" font-size="9.5" fill="#555">by 99.3–100%, and low sink rate perfectly predicts stable</text>
<text x="805" y="1505" text-anchor="middle" font-size="9.5" fill="#555">streaming across all tested models.</text>
<title>C2 [Contribution] (cites=0)
We verify the causal mechanism: gating reduces attention sink rate by 99.3–100%, and low sink rate perfectly predicts stable streaming across all tested models.</title>
</g>
<g>
<rect x="1003" y="1436" width="360" height="96" rx="6" fill="#d8ead4" stroke="#3e8a3e" stroke-width="1.2"/>
<text x="1183" y="1450" text-anchor="middle" font-size="10.5" font-weight="700" fill="#333">C3 [Contribution]</text>
<text x="1183" y="1465" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">C3: gains genuine, not degradation</text>
<text x="1183" y="1481" text-anchor="middle" font-size="9.5" fill="#555">We confirm that streaming stability gains are genuine—gated models</text>
<text x="1183" y="1493" text-anchor="middle" font-size="9.5" fill="#555">maintain comparable or slightly better full-attention perplexity</text>
<text x="1183" y="1505" text-anchor="middle" font-size="9.5" fill="#555">(12.71–12.79 vs 12.82 baseline), ruling out model degradation as</text>
<text x="1183" y="1517" text-anchor="middle" font-size="9.5" fill="#555">an explanation.</text>
<title>C3 [Contribution] (cites=0)
We confirm that streaming stability gains are genuine—gated models maintain comparable or slightly better full-attention perplexity (12.71–12.79 vs 12.82 baseline), ruling out model degradation as an explanation.</title>
</g>
