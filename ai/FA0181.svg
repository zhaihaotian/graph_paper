<text x="710" y="645" font-size="9.5" fill="#3a6a8a" font-weight="600" text-anchor="middle">has addressed this</text>
<line x1="616" y1="780" x2="616" y2="876" stroke="#c4502e" stroke-width="1.6" marker-end="url(#ar-crit)" opacity="0.9"/>
<text x="616" y="825" font-size="9.5" fill="#c4502e" font-weight="600" text-anchor="middle">While</text>
<line x1="616" y1="948" x2="994" y2="696" stroke="#666" stroke-width="1.2" marker-end="url(#ar)" opacity="0.9"/>
<line x1="994" y1="780" x2="994" y2="876" stroke="#666" stroke-width="1.2" marker-end="url(#ar)" opacity="0.9"/>
<line x1="994" y1="948" x2="805" y2="1044" stroke="#3a6a8a" stroke-width="1.5" marker-end="url(#ar-cons)" opacity="0.9"/>
<text x="899" y="993" font-size="9.5" fill="#3a6a8a" font-weight="600" text-anchor="middle">We propose</text>
<line x1="805" y1="1128" x2="805" y2="1156" stroke="#666" stroke-width="1.2" marker-end="url(#ar)" opacity="0.9"/>
<line x1="805" y1="1240" x2="427" y2="1336" stroke="#666" stroke-width="1.2" marker-end="url(#ar)" opacity="0.9"/>
