<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Argument Graph Viewer · AI vs Human Papers</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", Helvetica, Arial, sans-serif;
    background: #f5f3ec;
    color: #222;
  }
  header {
    background: #2b2b2b;
    color: #f5f3ec;
    padding: 12px 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    height: 50px;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 700; }
  header .subtitle { font-size: 12px; color: #aaa; }
  header .filters { margin-left: auto; display: flex; gap: 8px; }
  header .filters button {
    background: #444; color: #ddd; border: 1px solid #555;
    padding: 5px 12px; font-size: 12px; cursor: pointer; border-radius: 4px;
  }
  header .filters button.active {
    background: #c4502e; color: #fff; border-color: #c4502e;
  }

  #app {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: calc(100vh - 50px);
  }

  aside {
    background: #ece7d8;
    border-right: 1px solid #d6cfb8;
    overflow-y: auto;
  }
  aside .group-label {
    padding: 12px 16px 6px;
    font-size: 11px;
    font-weight: 700;
    color: #888;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  aside ul { list-style: none; margin: 0; padding: 0; }
  aside li {
    padding: 7px 16px;
    cursor: pointer;
    font-size: 13px;
    border-left: 3px solid transparent;
  }
  aside li:hover { background: #ddd6c0; }
  aside li.active {
    background: #fffaf0;
    border-left-color: #c4502e;
    font-weight: 600;
  }
  aside li .meta {
    display: block;
    font-size: 10.5px;
    color: #888;
    margin-top: 2px;
  }
  aside li .badge {
    display: inline-block;
    color: #fff;
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    margin-right: 5px;
    font-weight: 700;
    letter-spacing: 0.4px;
  }
  aside li.ai .badge { background: #c4502e; }
  aside li.human .badge { background: #3a8a7e; }

  main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .paper-header {
    padding: 14px 22px 10px;
    background: #fffaf0;
    border-bottom: 1px solid #d6cfb8;
  }
  .paper-header h2 { margin: 0 0 4px 0; font-size: 16px; }
  .paper-header h2 .label-tag {
    color: #999; font-size: 11px; font-weight: normal; margin-left: 8px;
  }
  .paper-header .topic { color: #555; font-size: 12px; line-height: 1.4; }
  .paper-header .anchor { margin-top: 4px; color: #888; font-size: 11px; }
  .paper-header .anchor strong { color: #555; }

  .split {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: #d6cfb8;
    overflow: hidden;
  }
  .pane {
    background: #fdfcf6;
    overflow: auto;
    display: flex;
    flex-direction: column;
  }
  .pane .pane-title {
    padding: 6px 14px;
    font-size: 11px;
    font-weight: 700;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: #f0ebd9;
    border-bottom: 1px solid #d6cfb8;
    flex-shrink: 0;
  }
  .pane .pane-body {
    flex: 1;
    overflow: auto;
    padding: 8px;
  }
  .pane object, .pane embed, .pane iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
  .pane .svg-host object {
    width: 100%;
    height: auto;
    min-height: 100%;
  }
  .pane .pdf-host {
    width: 100%;
    height: 100%;
  }
  .empty {
    color: #999;
    font-style: italic;
    text-align: center;
    padding: 60px;
  }
  .missing-pdf {
    color: #c4502e;
    text-align: center;
    padding: 40px;
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <h1>Argument Graph Viewer</h1>
  <span class="subtitle">AI vs Human-Written Papers · n=40</span>
  <div class="filters">
    <button data-filter="all" class="active">All (40)</button>
    <button data-filter="ai">AI only (20)</button>
    <button data-filter="human">Human only (20)</button>
  </div>
</header>

<div id="app">
  <aside id="sidebar"></aside>
  <main id="main">
    <div class="empty">Select a paper from the left.</div>
  </main>
</div>

paper": "", "nodes": 37, "edges": 40, "svg_path": "human/FA0012_anchor.svg", "pdf_path": "pdfs/human/FA0012_anchor.pdf"}, {"label": "human", "file": "FA0013_anchor.json", "paper_id": "FA0013_anchor", "topic": "Recurrent-Depth VLA: adaptive test-time compute for VLA via weight-tied recurrent latent refinement", "anchor_paper": "Latent reasoning / looped transformers [56, 14]", "nodes": 39, "edges": 45, "svg_path": "human/FA0013_anchor.svg", "pdf_path": "pdfs/human/FA0013_anchor.pdf"}, {"label": "human", "file": "FA0018_anchor.json", "paper_id": "FA0018_anchor", "topic": "TA-GRPO: Transform-Augmented GRPO that pools rewards across paraphrased variants to address GRPO's diversity collapse and gradient diminishing", "anchor_paper": "GRPO (Shao et al., 2024)", "nodes": 34, "edges": 38, "svg_path": "human/FA0018_anchor.svg", "pdf_path": "pdfs/human/FA0018_anchor.pdf"}, {"label": "human", "file": "FA0021_anchor.json", "paper_id": "FA0021_anchor", "topic": "iGRPO: a two-stage extension of GRPO that adds dynamic self-conditioning on the model's own best draft for mathematical reasoning RL", "anchor_paper": "GRPO (Shao et al., 2024)", "nodes": 23, "edges": 25, "svg_path": "human/FA0021_anchor.svg", "pdf_path": "pdfs/human/FA0021_anchor.pdf"}, {"label": "human", "file": "FA0022_anchor.json", "paper_id": "FA0022_anchor", "topic": "Data Repetition Beats Data Scaling in Long-CoT SFT: under a fixed update budget, more epochs on smaller SFT datasets outperforms more unique samples", "anchor_paper": "", "nodes": 22, "edges": 22, "svg_path": "human/FA0022_anchor.svg", "pdf_path": "pdfs/human/FA0022_anchor.pdf"}, {"label": "human", "file": "FA0032_anchor.json", "paper_id": "FA0032_anchor", "topic": "Conformal Thinking: distribution-free risk control for early-stopping reasoning LLMs on a compute budget", "anchor_paper": "", "nodes": 17, "edges": 19, "svg_path": "human/FA0032_anchor.svg", "pdf_path": "pdfs/human/FA0032_anchor.pdf"}, {"label": "human", "file": "FA0034_anchor.json", "paper_id": "FA0034_anchor", "topic": "VidVec: unlocking off-the-shelf video MLLM embeddings (intermediate-layer + calibrated head + text-only in-context optimization) for video-text retrieval", "anchor_paper": "E5-V (Jiang et al., 2024)", "nodes": 28, "edges": 33, "svg_path": "human/FA0034_anchor.svg", "pdf_path": "pdfs/human/FA0034_anchor.pdf"}, {"label": "human", "file": "ICLR_AttentionHeads.json", "paper_id": "ICLR_AttentionHeads", "topic": "Mechanistic interpretability of LLM safety via attention-head attribution (Ships and Sahara)", "anchor_paper": "", "nodes": 30, "edges": 29, "svg_path": "human/ICLR_AttentionHeads.svg", "pdf_path": "pdfs/human/ICLR_AttentionHeads.pdf"}, {"label": "human", "file": "ICLR_BIRD.json", "paper_id": "ICLR_BIRD", "topic": "Bayesian inference framework that aligns LLM-generated factors into a Bayesian network for accurate, interpretable probability estimation", "anchor_paper": "", "nodes": 34, "edges": 33, "svg_path": "human/ICLR_BIRD.svg", "pdf_path": "pdfs/human/ICLR_BIRD.pdf"}, {"label": "human", "file": "ICLR_Backtracking.json", "paper_id": "ICLR_Backtracking", "topic": "Backtracking via a special [RESET] token lets language models undo and recover from their own unsafe generations during SFT/DPO training", "anchor_paper": "", "nodes": 18, "edges": 19, "svg_path": "human/ICLR_Backtracking.svg", "pdf_path": "pdfs/human/ICLR_Backtracking.pdf"}, {"label": "human", "file": "ICLR_InferenceScaling.json", "paper_id": "ICLR_InferenceScaling", "topic": "Inference scaling laws for long-context retrieval-augmented generation; introduces DRAG and IterDRAG and a computation-allocation model", "anchor_paper": "", "nodes": 38, "edges": 40, "svg_path": "human/ICLR_InferenceScaling.svg", "pdf_path": "pdfs/human/ICLR_InferenceScaling.pdf"}, {"label": "human", "file": "ICLR_InfluenceFunctions.json", "paper_id": "ICLR_InfluenceFunctions", "topic": "Scalable K-FAC-based influence functions for data attribution in diffusion models", "anchor_paper": "Koh & Liang (2017) Influence Functions / Bae et al. (2022)", "nodes": 26, "edges": 28, "svg_path": "human/ICLR_InfluenceFunctions.svg", "pdf_path": "pdfs/human/ICLR_InfluenceFunctions.pdf"}, {"label": "human", "file": "ICLR_KAN.json", "paper_id": "ICLR_KAN", "topic": "Kolmogorov-Arnold Networks: a learnable-edge-activation alternative to MLPs based on the Kolmogorov-Arnold representation theorem", "anchor_paper": "Kolmogorov-Arnold representation theorem (Kolmogorov 1957 / Arnold 1957)", "nodes": 27, "edges": 28, "svg_path": "human/ICLR_KAN.svg", "pdf_path": "pdfs/human/ICLR_KAN.pdf"}, {"label": "human", "file": "ICLR_LinearRNN.json", "paper_id": "ICLR_LinearRNN", "topic": "Extending state-transition matrix eigenvalues from [0,1] to [-1,1] to unlock state-tracking in linear RNNs", "anchor_paper": "Sarrof et al. (2024)", "nodes": 22, "edges": 21, "svg_path": "human/ICLR_LinearRNN.svg", "pdf_path": "pdfs/human/ICLR_LinearRNN.pdf"}, {"label": "human", "file": "ICLR_NeuralODE.json", "paper_id": "ICLR_NeuralODE", "topic": "Establishing global convergence of Neural ODEs under gradient descent by analyzing the role of activation function smoothness and nonlinearity in well-posedness and NTK spectral properties", "anchor_paper": "", "nodes": 38, "edges": 38, "svg_path": "human/ICLR_NeuralODE.svg", "pdf_path": "pdfs/human/ICLR_NeuralODE.pdf"}, {"label": "human", "file": "ICLR_WizardMath.json", "paper_id": "ICLR_WizardMath", "topic": "WizardMath: enhancing LLM math reasoning via Reinforcement Learning from Evol-Instruct Feedback (RLEIF) with IRM and PRM", "anchor_paper": "Evol-Instruct (WizardLM, Xu et al. 2023)", "nodes": 35, "edges": 34, "svg_path": "human/ICLR_WizardMath.svg", "pdf_path": "pdfs/human/ICLR_WizardMath.pdf"}];
const sidebar = document.getElementById('sidebar');
const main = document.getElementById('main');
let currentFilter = 'all';
let currentFile = null;

function renderSidebar() {
  sidebar.innerHTML = '';
  const groups = { ai: [], human: [] };
  PAPERS.forEach(p => groups[p.label].push(p));
  for (const label of ['ai', 'human']) {
    if (currentFilter !== 'all' && currentFilter !== label) continue;
    const labelText = label === 'ai' ? 'AI-Generated (FARS)' : 'Human-Written';
    sidebar.insertAdjacentHTML('beforeend',
      `<div class="group-label">${labelText} (${groups[label].length})</div>`);
    const ul = document.createElement('ul');
    for (const p of groups[label]) {
      const li = document.createElement('li');
      li.className = label;
      if (p.file === currentFile) li.classList.add('active');
      li.innerHTML = `
        <span class="badge">${label.toUpperCase()}</span>${p.paper_id}
        <span class="meta">${p.nodes}n · ${p.edges}e</span>
      `;
      li.addEventListener('click', () => selectPaper(p));
      ul.appendChild(li);
    }
    sidebar.appendChild(ul);
  }
}

function selectPaper(p) {
  currentFile = p.file;
  document.querySelectorAll('aside li').forEach(li => li.classList.remove('active'));
  for (const li of sidebar.querySelectorAll('li')) {
    if (li.textContent.includes(p.paper_id)) {
      li.classList.add('active');
      break;
    }
  }
  renderMain(p);
}

function renderMain(p) {
  const anchorHtml = p.anchor_paper
    ? `<div class="anchor"><strong>Anchor paper:</strong> ${escapeHtml(p.anchor_paper)}</div>`
    : '';
  const pdfHtml = p.pdf_path
    ? `<div class="pdf-host"><object data="${p.pdf_path}#view=FitH" type="application/pdf">
        <p class="missing-pdf">Browser cannot display PDF inline.
        <a href="${p.pdf_path}" target="_blank">Open in new tab</a>.</p>
      </object></div>`
    : `<div class="missing-pdf">No PDF available for this paper.</div>`;
  main.innerHTML = `
    <div class="paper-header">
      <h2>${p.paper_id} <span class="label-tag">${p.label}</span></h2>
      <div class="topic">${escapeHtml(p.topic)}</div>
      ${anchorHtml}
    </div>
    <div class="split">
      <div class="pane">
        <div class="pane-title">Argument Graph</div>
        <div class="pane-body svg-host">
          <object type="image/svg+xml" data="${p.svg_path}"></object>
        </div>
      </div>
      <div class="pane">
        <div class="pane-title">Original PDF</div>
        <div class="pane-body" style="padding:0;">
          ${pdfHtml}
        </div>
      </div>
    </div>
  `;
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

document.querySelectorAll('header .filters button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('header .filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderSidebar();
  });
});

renderSidebar();
if (PAPERS.length > 0) selectPaper(PAPERS[0]);
</script>
</body>
</html>
